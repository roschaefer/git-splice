[package]
name = "git-splice"
version = "0.21.0"
edition = "2021"
license = "MIT"
description = "Keep folders of a monorepo in sync with their own repositories, in both directions"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `cargo build` builds the checkout-only documentation checkers too. scrut/ is
# a splice with its own lock file.
[workspace]
members = ["check-drawing", "check-help"]
default-members = [".", "check-drawing", "check-help"]
exclude = ["scrut"]
