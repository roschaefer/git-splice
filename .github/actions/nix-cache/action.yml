name: Nix packages from cache
description: >
  Puts the dev shell's packages that cache.nixos.org doesn't have into the
  Nix store: scrut, built from scrut/ (about four minutes in CI), and the
  Jujutsu and Sapling release binaries, downloaded from GitHub, which
  sometimes answers 504. One cache entry holds all of them, so a job makes
  one cache request. Its key is their derivations, so it changes exactly
  when a build would. When one package changes, the previous entry still
  restores the others, and only that one is built.

runs:
  using: composite
  steps:
    # Copies by store path: given the flake, nix copy would also copy
    # nixpkgs' sources through the cache, which takes minutes.
    - id: drv
      shell: bash
      run: |
        outs=()
        drvs=()
        for package in scrut jujutsu sapling; do
          drvs+=("$(basename "$(nix eval --raw ".#$package.drvPath")" .drv)")
          outs+=("$(nix eval --raw ".#$package.outPath")")
        done
        echo "hash=$(printf '%s\n' "${drvs[@]}" | sha256sum | cut -c1-32)" >>"$GITHUB_OUTPUT"
        echo "outs=${outs[*]}" >>"$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/nix-cache
        key: nix-packages-${{ steps.drv.outputs.hash }}
        restore-keys: nix-packages-

    # After a partial restore (restore-keys), some paths are missing from
    # the cache; nix build below fetches or builds those.
    - if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      env:
        OUTS: ${{ steps.drv.outputs.outs }}
      run: |
        for out in $OUTS; do
          nix copy --no-check-sigs --from "file://$RUNNER_TEMP/nix-cache" "$out" ||
            echo "Not in the cache: $out"
        done

    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        OUTS: ${{ steps.drv.outputs.outs }}
      run: |
        nix build --no-link .#scrut .#jujutsu .#sapling
        rm -rf "$RUNNER_TEMP/nix-cache"
        # shellcheck disable=SC2086 # one store path per word
        nix copy --to "file://$RUNNER_TEMP/nix-cache" $OUTS

    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/nix-cache
        key: nix-packages-${{ steps.drv.outputs.hash }}
