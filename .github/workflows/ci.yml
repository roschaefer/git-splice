name: CI

# Branches other than main are checked by their PR's run: a push trigger
# for them would run everything twice.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run for the push before it. Other runs get
# a group of their own (run_id), so every commit on main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bats tests take longer than the other checks together, so they get a
  # job of their own and the two run side by side.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # The dev shell has scrut, so every job that enters it needs it.
      - uses: ./.github/actions/scrut-cache

      - name: test
        run: nix develop --command just test

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # The dev shell has scrut, so every job that enters it needs it.
      - uses: ./.github/actions/scrut-cache

      - name: lint
        run: nix develop --command just lint

      - name: fmt-check
        run: nix develop --command just fmt-check

      - name: docs-check
        run: nix develop --command just docs-check

      - name: site-build
        run: nix develop --command just site-build

      # Builds the package and runs it through `git splice` in the sandbox.
      - name: nix flake check
        run: nix flake check -L

  compat:
    # The oldest Git the tool accepts; test covers a current one. Named
    # after the version under test rather than the nixpkgs revision it comes
    # from. The test step fails first if the label drifts from what the
    # revision ships.
    name: compat (git 2.40.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # The build runs in the dev shell, which has scrut.
      - uses: ./.github/actions/scrut-cache

      - name: build
        run: nix develop --command cargo build

      - name: test
        run: |
          # The script is single-quoted so it expands inside the nix shell.
          # shellcheck disable=SC2016
          nix shell \
            "github:NixOS/nixpkgs/nixos-23.05#git" \
            "nixpkgs#bashInteractive" \
            "nixpkgs#bats" \
            "nixpkgs#parallel" \
            "nixpkgs#zsh" \
            "nixpkgs#xmlstarlet" \
            --command bash -c '
              set -e
              git_version="$(git --version | sed "s/^git version //")"
              echo "git: $git_version"
              if [ "$git_version" != 2.40.1 ]; then
                echo "::error::the job says git 2.40.1, nixos-23.05 has $git_version -- update it in ci.yml"
                exit 1
              fi
              bats --recursive --jobs "$(nproc)" test
            '

  release-please:
    needs: [test, lint-docs, compat]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One at a time: two runs could both find a tarball missing, and the
    # second upload would fail on the asset the first one just added.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A fine-grained token rather than GITHUB_TOKEN, whose pull requests
      # and tags trigger no workflows, so the release PR would get no CI.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Not gated on release_created: a rerun after a failed upload sees the
      # release as already created, so this checks every release for what's
      # missing instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Attach tarballs to releases that lack one
        # Explicit, so the step runs with pipefail: a failing `gh release
        # list` must not look like there are no releases.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --exclude-pre-releases --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              asset="git-splice-$tag.tar.gz"
              has_asset="$(gh release view "$tag" --json assets --jq "any(.assets[]; .name == \"$asset\")")"
              if [[ "$has_asset" == true ]]; then
                continue
              fi
              git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
              git archive --format=tar.gz --prefix=git-splice/ -o "$asset" "$tag"
              gh release upload "$tag" "$asset"
            done

  # Builds a binary on every PR, so a release isn't the first time a target
  # builds, and publishes it when this push created a release. After a failed
  # upload, re-run the failed jobs: they keep release-please's outputs.
  binaries:
    needs: [release-please]
    # release-please runs only on main; skipped there, this still runs.
    if: ${{ always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    permissions:
      contents: write
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and run it
        shell: bash
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --package git-splice --target "$TARGET"
          "target/$TARGET/release/git-splice" --version

      - name: Publish it
        if: needs.release-please.outputs.release_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          asset="git-splice-$TAG-$TARGET.tar.gz"
          mkdir git-splice
          cp "target/$TARGET/release/git-splice" LICENSE git-splice/
          cp -R completions git-splice/
          tar -czf "$asset" git-splice
          gh release upload --clobber "$TAG" "$asset"
