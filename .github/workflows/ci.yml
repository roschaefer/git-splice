name: CI

# Branches other than main are checked by their PR's run: a push trigger
# for them would run everything twice.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run for the push before it. Other runs get
# a group of their own (run_id), so every commit on main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bats tests take longer than the other checks together, so they get a
  # job of their own and the two run side by side.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # The dev shell has packages cache.nixos.org lacks, so every job that
      # enters it needs them.
      - uses: ./.github/actions/nix-cache

      - name: test
        run: nix develop --command just test

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # The dev shell has packages cache.nixos.org lacks, so every job that
      # enters it needs them.
      - uses: ./.github/actions/nix-cache

      - name: lint
        run: nix develop --command just lint

      - name: fmt-check
        run: nix develop --command just fmt-check

      - name: docs-check
        run: nix develop --command just docs-check

      - name: site-build
        run: nix develop --command just site-build

      # Builds the package and runs it through `git splice` in the sandbox.
      - name: nix flake check
        run: nix flake check -L

  compat:
    # The oldest Git the tool accepts; test covers a current one. Named
    # after the version under test rather than the nixpkgs revision it comes
    # from. The test step fails first if the label drifts from what the
    # revision ships.
    name: compat (git 2.40.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # The build runs in the dev shell, which needs them too.
      - uses: ./.github/actions/nix-cache

      - name: build
        run: nix develop --command cargo build

      - name: test
        run: |
          # The script is single-quoted so it expands inside the nix shell.
          # shellcheck disable=SC2016
          nix shell \
            "github:NixOS/nixpkgs/nixos-23.05#git" \
            "nixpkgs#bashInteractive" \
            "nixpkgs#bats" \
            "nixpkgs#parallel" \
            "nixpkgs#zsh" \
            "nixpkgs#xmlstarlet" \
            --command bash -c '
              set -e
              git_version="$(git --version | sed "s/^git version //")"
              echo "git: $git_version"
              if [ "$git_version" != 2.40.1 ]; then
                echo "::error::the job says git 2.40.1, nixos-23.05 has $git_version -- update it in ci.yml"
                exit 1
              fi
              bats --recursive --jobs "$(nproc)" test
            '

  # Builds and packages a binary on every PR, so a release isn't the first
  # time a target builds. Needs no tests: release-please attaches the
  # binaries once the tests pass.
  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and run it
        shell: bash
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --package git-splice --target "$TARGET"
          "target/$TARGET/release/git-splice" --version

      # A tarball, because artifacts lose the executable bit.
      - name: Package it
        shell: bash
        run: |
          mkdir git-splice
          cp "target/$TARGET/release/git-splice" LICENSE git-splice/
          cp -R completions git-splice/
          tar -czf "git-splice-$TARGET.tar.gz" git-splice

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-splice-${{ matrix.target }}
          path: git-splice-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release-please:
    # Needs the binaries too, so a release gets all of them or none: with a
    # target that doesn't build, release-please makes no release yet.
    needs: [test, lint-docs, compat, binaries]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One at a time: two runs could both find a tarball missing, and the
    # second upload would fail on the asset the first one just added.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # A fine-grained token rather than GITHUB_TOKEN, whose pull requests
      # and tags trigger no workflows, so the release PR would get no CI.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # The steps below aren't gated on release_created: a re-run after a
      # failed upload sees the release as already created, so they check
      # for what's missing instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Attach tarballs to releases that lack one
        # Explicit, so the step runs with pipefail: a failing `gh release
        # list` must not look like there are no releases.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --exclude-pre-releases --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              asset="git-splice-$tag.tar.gz"
              has_asset="$(gh release view "$tag" --json assets --jq "any(.assets[]; .name == \"$asset\")")"
              if [[ "$has_asset" == true ]]; then
                continue
              fi
              git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
              git archive --format=tar.gz --prefix=git-splice/ -o "$asset" "$tag"
              gh release upload "$tag" "$asset"
            done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: git-splice-*
          path: binaries
          merge-multiple: true

      # This run's binaries belong only to a release of this very commit:
      # release-please tags the commit that merges its release PR.
      - name: Attach binaries to this commit's release if it lacks them
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r '."."' .release-please-manifest.json)"
          # Fails the step when the lookup fails, so that isn't mistaken for
          # "no release". An annotated tag also lists its commit as ^{}.
          tagged="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if ! grep -q "^$GITHUB_SHA" <<<"$tagged"; then
            echo "No release of this commit."
            exit 0
          fi
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for tarball in binaries/git-splice-*.tar.gz; do
            asset="git-splice-$tag-${tarball#binaries/git-splice-}"
            if grep -qxF "$asset" <<<"$assets"; then
              continue
            fi
            mv "$tarball" "$asset"
            gh release upload "$tag" "$asset"
          done
