<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 438" role="img" aria-labelledby="title desc"><title id="title">File history and upstream provenance are separate parent roles</title><desc id="desc">A normal merge joins both parent histories. A weak parent provides upstream provenance, while the first parent carries file history. Today .splice represents that weak parent in a file; tools can resolve it for blame, bisect and log.</desc><rect width="900" height="438" fill="white"/><style>text{font:16px system-ui,sans-serif;fill:#243342}.title{font-weight:600}.small{font-size:14px}.label{font-size:13px}.box{fill:#f4f7fa;stroke:#526779;stroke-width:1.5}.upstream{fill:#e8f1fb;stroke:#3974a8;stroke-width:1.5}.arrow{fill:none;stroke:#526779;stroke-width:1.7;marker-end:url(#arrow)}.provenance{fill:none;stroke:#3974a8;stroke-width:1.7;stroke-dasharray:6 4;marker-end:url(#blue)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526779"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3974a8"/></marker></defs><g transform="translate(0 0)"><text class="title" x="22" y="32">Normal merge</text><rect class="box" x="15" y="50" width="270" height="335" rx="10"/>
<circle class="box" cx="60" cy="105" r="16"/><text class="small" x="84" y="110">first parent</text><path class="arrow" d="M60 121V204"/><text class="label" x="76" y="165">file history</text>
<circle class="box" cx="60" cy="225" r="19"/><text class="small" x="30" y="263">pull</text><circle class="upstream" cx="235" cy="125" r="18"/><text class="small" x="210" y="89">U(H)</text><path class="arrow" d="M220 135L79 214"/><text class="label" x="160" y="202">second parent</text><text class="small" x="32" y="332">Both parents join</text><text class="small" x="32" y="354">the commit history</text></g><g transform="translate(300 0)"><text class="title" x="22" y="32">Weak parent (idea)</text><rect class="box" x="15" y="50" width="270" height="335" rx="10"/>
<circle class="box" cx="60" cy="105" r="16"/><text class="small" x="84" y="110">first parent</text><path class="arrow" d="M60 121V204"/><text class="label" x="76" y="165">file history</text>
<circle class="box" cx="60" cy="225" r="19"/><text class="small" x="30" y="263">pull</text><circle class="upstream" cx="235" cy="125" r="18"/><text class="small" x="210" y="89">U(H)</text><path class="provenance" d="M79 215L218 136"/><text class="label" x="157" y="202">provenance</text><text class="small" x="32" y="332">Separate parent role:</text><text class="small" x="32" y="354">trace upstream provenance</text></g><g transform="translate(600 0)"><text class="title" x="22" y="32">.splice (today)</text><rect class="box" x="15" y="50" width="270" height="335" rx="10"/>
<circle class="box" cx="60" cy="105" r="16"/><text class="small" x="84" y="110">first parent</text><path class="arrow" d="M60 121V204"/><text class="label" x="76" y="165">file history</text>
<circle class="box" cx="60" cy="225" r="19"/><text class="small" x="30" y="263">pull</text><circle class="upstream" cx="235" cy="125" r="18"/><text class="small" x="210" y="89">U(H)</text><path class="arrow" d="M79 230H120"/><rect class="upstream" x="125" y="213" width="139" height="62" rx="6"/><text class="small" x="137" y="238">lib/.splice</text><text class="label" x="137" y="259">URL + commit</text><path class="provenance" d="M235 213V146"/><text class="label" x="147" y="183">provenance</text><text class="small" x="32" y="332">Weak parent stored in a file</text><text class="small" x="32" y="354">Tools can resolve it today</text></g><text class="small" x="22" y="416">Solid: file history or recorded content. Dashed: resolve upstream provenance for blame, bisect and log.</text></svg>
