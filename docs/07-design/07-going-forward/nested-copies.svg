<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Each app contains its library</title><desc id="desc">Two app folders in a monorepo each contain lib/. Each app is complete in its own upstream, so the library copies can have different versions.</desc><rect width="720" height="300" fill="white"/><style>text{font:16px system-ui,sans-serif;fill:#243342}.title{font-weight:600}.small{font-size:14px}.box{fill:#f4f7fa;stroke:#526779;stroke-width:1.5}.lib{fill:#e8f1fb;stroke:#3974a8;stroke-width:1.5}.arrow{fill:none;stroke:#526779;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526779"/></marker></defs><rect class="box" x="20" y="20" width="680" height="260" rx="12"/><text class="title" x="40" y="50">monorepo</text>
<rect class="box" x="40" y="75" width="300" height="145" rx="8"/><text class="title" x="60" y="105">app-a/</text><rect class="lib" x="60" y="125" width="260" height="70" rx="6"/><text x="80" y="153">lib/</text><text class="small" x="80" y="178">version used by app A</text>
<rect class="box" x="380" y="75" width="300" height="145" rx="8"/><text class="title" x="400" y="105">app-b/</text><rect class="lib" x="400" y="125" width="260" height="70" rx="6"/><text x="420" y="153">lib/</text><text class="small" x="420" y="178">version used by app B</text>
<text class="small" x="40" y="254">Each app brings its own library files. Neither copy refers to the other.</text></svg>
